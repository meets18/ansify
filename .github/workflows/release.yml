name: Build release artifacts

# Builds the wheel + sdist and attaches them to a GitHub Release whenever a
# v* tag is pushed. Anyone can then install with:
#
#   pip install https://github.com/meets18/ansify/releases/download/v0.1.0/ansify_cli-0.1.0-py3-none-any.whl
#
# Create a release by tagging:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
